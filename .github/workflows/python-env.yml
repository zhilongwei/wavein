name: Python environment

on:
  push:
    branches: [main]
    paths:
      - scripts/**/*.py
      - scripts/pyproject.toml
      - scripts/uv.lock
      - .github/workflows/python-env.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/**/*.py
      - scripts/pyproject.toml
      - scripts/uv.lock
      - .github/workflows/python-env.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-env-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync locked environment (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock

      - name: Validate and sync the lockfile
        run: uv sync --project scripts --locked

      - name: Test the wave-tank input generator
        run: uv run --project scripts python -m unittest discover -s scripts/tests

      - name: Minimize the CI cache
        if: always()
        run: uv cache prune --ci
