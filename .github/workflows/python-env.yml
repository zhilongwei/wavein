name: Python environment

on:
  push:
    branches: [main]
    paths:
      - scripts/pyproject.toml
      - scripts/uv.lock
      - .github/workflows/python-env.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/pyproject.toml
      - scripts/uv.lock
      - .github/workflows/python-env.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-env-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync locked environment (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock

      - name: Validate and sync the lockfile
        run: uv sync --project scripts --locked

      - name: Minimize the CI cache
        if: always()
        run: uv cache prune --ci
